[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-logstream"
version = "0.1.0"
description = "Streaming line reader for large remote log files over SSH."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Timur Anvar" }]
keywords = ["ssh", "logs", "streaming", "tail", "remote-files"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Logging",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "paramiko>=3.4,<4.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "twine>=5.1.0",
    "types-paramiko>=3.4,<4.0",
]

[project.urls]
Homepage = "https://github.com/DreamyStranger/ssh-logstream"
Repository = "https://github.com/DreamyStranger/ssh-logstream"
Issues = "https://github.com/DreamyStranger/ssh-logstream/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["ssh_logstream*"]

[tool.setuptools.package-data]
ssh_logstream = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: marks tests that require an SSH-accessible host",
]

[tool.coverage.run]
source = ["ssh_logstream"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "ANN",
    "RUF",
]
ignore = [
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001", "ANN201", "N802"]

[tool.mypy]
python_version = "3.10"
packages = ["ssh_logstream"]
mypy_path = ["src"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
